<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Manutenção Paineira</title><style>body{font:16px system-ui;background:#f4f7f5;margin:0;color:#193b2c}header{background:#174c36;color:white;text-align:center;padding:20px}main{max-width:600px;margin:auto;padding:16px}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #bbc;width:100%;box-sizing:border-box}button{background:#174c36;color:white;margin-top:12px;border:0}.hidden{display:none} .tabs{display:flex;gap:8px;margin:12px 0}.tabs button{margin:0} .tabs button.inactive{background:#87958b} section{background:white;padding:12px;border-radius:12px;margin:16px 0}.check{display:flex;align-items:center;gap:10px;padding:8px}.check input{width:auto}article{border-bottom:1px solid #ddd;padding:10px}.notice{background:#edf4ed;border-left:4px solid #174c36;padding:12px;margin:12px 0;border-radius:6px}.warn{background:#fff1d9;border-left-color:#b36a00}.overdue{background:#ffe5e5;border-left-color:#c22}.small{font-size:13px;color:#53685a}</style><header><b>CONTROLE DE MANUTENÇÃO</b><div>AGROPECUÁRIA PAINEIRA</div></header><main><nav class='tabs'><button id='tabForm' type='button' onclick="showTab('form')">MANUTENÇÃO</button><button id='tabReport' class='inactive' type='button' onclick="showTab('report')">RELATÓRIO</button></nav><div id='formPane'><form id='f'><label>Máquina</label><select id='m'></select><label>Data</label><input id='d' type='date' required><label class='check'><input id='w' type='checkbox' checked>Horímetro funcionando</label><div id='hw'><label>Horas trabalhadas</label><input id='h' type='number' min='0' step='.1'></div><div id='due' class='notice'></div><h3>Serviços realizados</h3><div id='s'></div><button>SALVAR</button></form></div><section id='reportPane' class='hidden'><h3>Relatório</h3><label>Filtrar máquina</label><select id='filter'></select><button onclick='print()'>IMPRIMIR / PDF</button><div id='r'></div></section></main><script>const $=x=>document.getElementById(x);window.showTab=t=>{$('formPane').classList.toggle('hidden',t!=='form');$('reportPane').classList.toggle('hidden',t!=='report');$('tabForm').classList.toggle('inactive',t!=='form');$('tabReport').classList.toggle('inactive',t!=='report')};let editing=null;const ms=['Colheitadeira TC5070','Trator NH 7630','Trator NH TL75','Pulverizador SP NH 2500','Trator John Deere','Retroescavadeira LB90'],ss=['Óleo do motor','Filtro de óleo do motor','Filtro diesel','Filtro hidráulico','Óleo da transmissão','Óleo dos cubos das rodas','Óleo do diferencial','Filtro de ar do motor'];$('m').innerHTML=ms.map(x=>'<option>'+x+'</option>').join('');$('filter').innerHTML='<option value="">Todas as máquinas</option>'+ms.map(x=>'<option>'+x+'</option>').join('');$('filter').onchange=render;$('s').innerHTML=ss.map((x,i)=>'<label class="check"><input type="checkbox" name="svc" value="'+i+'">'+x+'</label>').join('');$('d').value=new Date().toLocaleDateString('en-CA');$('w').onchange=()=>{$('hw').hidden=!$('w').checked;updateDue()};$('m').onchange=updateDue;$('h').oninput=updateDue;let data=JSON.parse(localStorage.getItem('paineira-manutencao')||'[]');function render(){$('r').innerHTML=data.filter(x=>!$('filter').value||x.m===$('filter').value).slice().reverse().map((x,i)=>'<article><b>'+x.m+'</b><p>'+x.d.split('-').reverse().join('/')+' · '+(x.w?x.h+' h':'Sem horímetro')+'</p>'+x.s.map(j=>'✓ '+ss[j]).join('<br>')+'<br><button onclick="edit('+x.id+')">EDITAR</button><button onclick="del('+x.id+')">EXCLUIR</button></article>').join('')||'Nenhuma manutenção registrada'}window.edit=id=>{const x=data.find(y=>y.id===id);if(!x)return;editing=id;$('m').value=x.m;$('d').value=x.d;$('w').checked=x.w;$('w').onchange();$('h').value=x.h;document.querySelectorAll('[name=svc]').forEach(e=>e.checked=x.s.includes(+e.value));showTab('form');updateDue();window.scrollTo(0,0)};window.del=id=>{if(confirm('Excluir?')){data=data.filter(x=>x.id!==id);localStorage.setItem('paineira-manutencao',JSON.stringify(data));window.firebaseDelete?.(id);render();updateDue()}};$('f').onsubmit=e=>{e.preventDefault();const s=[...document.querySelectorAll('[name=svc]:checked')].map(x=>+x.value);if(!s.length)return alert('Selecione um serviço');const record={id:editing||Date.now(),m:$('m').value,d:$('d').value,w:$('w').checked,h:$('h').value,s};if(editing)data=data.map(x=>x.id===editing?record:x);else data.push(record);editing=null;localStorage.setItem('paineira-manutencao',JSON.stringify(data));window.firebaseSave?.(record);document.querySelectorAll('[name=svc]').forEach(e=>e.checked=false);$('h').value='';$('d').value=new Date().toLocaleDateString('en-CA');$('w').checked=true;$('w').onchange();render();updateDue();showTab('report');alert('Registro salvo no celular. Confira o status do Firebase.')};window.applyCloudRecords=rows=>{data=rows;localStorage.setItem('paineira-manutencao',JSON.stringify(data));render();updateDue()};function updateDue(){const m=$('m').value,history=data.filter(x=>x.m===m&&x.id!==editing).sort((a,b)=>a.d.localeCompare(b.d)),last=history.at(-1),n=history.length;let next=n+1;let tier=next%4===0?'COMPLETA (1.200 h)':next%2===0?'600 h':'BÁSICA (300 h)';let expected=next%4===0?[0,1,2,3,4,5,6,7]:next%2===0?[0,1,2,3]:[0,1,2];let current=Number($('h').value);let lastHours=history.filter(x=>x.w&&x.h!==''&&Number.isFinite(Number(x.h))).at(-1);let html='<b>Próxima revisão: '+tier+'</b><div class="small">Serviços previstos: '+expected.map(i=>ss[i]).join(', ')+'</div>';let status='';if($('w').checked&&$('h').value!==''&&lastHours){let remaining=Number(lastHours.h)+300-current;status=remaining<=0?'Revisão por horas vencida':remaining<=20?'Atenção: faltam '+Math.max(0,remaining).toLocaleString('pt-BR')+' h para a revisão':'Faltam '+remaining.toLocaleString('pt-BR')+' h para a revisão'}else if($('w').checked&&!lastHours){status='Sem revisão anterior com horímetro registrada; informe uma manutenção para iniciar o acompanhamento'}if(last){let due=new Date(last.d+'T12:00:00');due.setFullYear(due.getFullYear()+1);let days=Math.ceil((due-new Date())/86400000);if(days<=30)status+=(status?' · ':'')+(days<=0?'Revisão anual vencida':'Revisão anual em '+days+' dias')}else status+=(status?' · ':'')+'Primeira manutenção cadastrada inicia o histórico';$('due').className='notice'+(/vencida/i.test(status)?' overdue':/faltam 20|atenção|em \d+ dias/i.test(status)?' warn':'');$('due').innerHTML=html+'<div>'+status+'</div>'}render();updateDue()</script><p id='firebaseMessage' style='display:none' aria-live='polite'></p><input id='firebaseUid' type='hidden'><script type='module' src='./firebase-sync.js'></script></html>
