<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Manutenção Paineira</title><style>body{font:16px system-ui;background:#f4f7f5;margin:0;color:#193b2c}header{background:#174c36;color:white;text-align:center;padding:20px}main{max-width:600px;margin:auto;padding:16px}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #bbc;width:100%;box-sizing:border-box}button{background:#174c36;color:white;margin-top:12px;border:0}.hidden{display:none} .tabs{display:flex;gap:8px;margin:12px 0}.tabs button{margin:0} .tabs button.inactive{background:#87958b} section{background:white;padding:12px;border-radius:12px;margin:16px 0}.check{display:flex;align-items:center;gap:10px;padding:8px}.check input{width:auto}article{border-bottom:1px solid #ddd;padding:10px}</style><header><b>CONTROLE DE MANUTENÇÃO</b><div>AGROPECUÁRIA PAINEIRA</div></header><main><nav class='tabs'><button id='tabForm' type='button' onclick="showTab('form')">MANUTENÇÃO</button><button id='tabReport' class='inactive' type='button' onclick="showTab('report')">RELATÓRIO</button></nav><div id='formPane'><form id='f'><label>Máquina</label><select id='m'></select><label>Data</label><input id='d' type='date' required><label class='check'><input id='w' type='checkbox' checked>Horímetro funcionando</label><div id='hw'><label>Horas trabalhadas</label><input id='h' type='number' min='0' step='.1'></div><h3>Serviços realizados</h3><div id='s'></div><button>SALVAR</button></form></div><section id='reportPane' class='hidden'><h3>Relatório</h3><button onclick='print()'>IMPRIMIR / PDF</button><div id='r'></div></section></main><script>const $=x=>document.getElementById(x);window.showTab=t=>{$('formPane').classList.toggle('hidden',t!=='form');$('reportPane').classList.toggle('hidden',t!=='report');$('tabForm').classList.toggle('inactive',t!=='form');$('tabReport').classList.toggle('inactive',t!=='report')};let editing=null;const ms=['Colheitadeira TC5070','Trator NH 7630','Trator NH TL75','Pulverizador SP NH 2500','Trator John Deere','Retroescavadeira LB90'],ss=['Óleo do motor','Filtro de óleo do motor','Filtro diesel','Filtro hidráulico','Óleo da transmissão','Óleo dos cubos das rodas','Óleo do diferencial','Filtro de ar do motor'];$('m').innerHTML=ms.map(x=>'<option>'+x+'</option>').join('');$('s').innerHTML=ss.map((x,i)=>'<label class="check"><input type="checkbox" name="svc" value="'+i+'">'+x+'</label>').join('');$('d').value=new Date().toLocaleDateString('en-CA');$('w').onchange=()=>{$('hw').hidden=!$('w').checked};let data=JSON.parse(localStorage.getItem('paineira-manutencao')||'[]');function render(){$('r').innerHTML=data.slice().reverse().map((x,i)=>'<article><b>'+x.m+'</b><p>'+x.d.split('-').reverse().join('/')+' · '+(x.w?x.h+' h':'Sem horímetro')+'</p>'+x.s.map(j=>'✓ '+ss[j]).join('<br>')+'<br><button onclick="edit('+x.id+')">EDITAR</button><button onclick="del('+x.id+')">EXCLUIR</button></article>').join('')||'Nenhuma manutenção registrada'}window.edit=id=>{const x=data.find(y=>y.id===id);if(!x)return;editing=id;$('m').value=x.m;$('d').value=x.d;$('w').checked=x.w;$('w').onchange();$('h').value=x.h;document.querySelectorAll('[name=svc]').forEach(e=>e.checked=x.s.includes(+e.value));showTab('form');window.scrollTo(0,0)};window.del=id=>{if(confirm('Excluir?')){data=data.filter(x=>x.id!==id);localStorage.setItem('paineira-manutencao',JSON.stringify(data));render()}};$('f').onsubmit=e=>{e.preventDefault();const s=[...document.querySelectorAll('[name=svc]:checked')].map(x=>+x.value);if(!s.length)return alert('Selecione um serviço');const record={id:editing||Date.now(),m:$('m').value,d:$('d').value,w:$('w').checked,h:$('h').value,s};if(editing)data=data.map(x=>x.id===editing?record:x);else data.push(record);editing=null;localStorage.setItem('paineira-manutencao',JSON.stringify(data));render();showTab('report');alert('Salvo!')};render()</script></html>
